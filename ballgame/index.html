<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="format-detection" content="email=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="full-screen" content="yes">
  <meta name="browsermode" content="application">
  <meta name="x5-orientation" content="landscape">
  <meta name="x5-fullscreen" content="true">
  <meta name="x5-page-mode" content="app">
  <meta name="msapplication-tap-highlight" content="no">
  <title>Attack on Ball</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .game {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background-color: black;
    }
  </style>
</head>
<body>
  <div id="game" class="game"></div>

  <!-- Load Phaser library from CDN for reliability -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script>
    const conf = {
      screenWidth: 92.5,   // Screen width in CM
      screenHeight: 52,    // Screen height in CM
      heatmapTime: 500,    // Heatmap recording interval in ms
      sound: 50,           // Sound volume percentage
      gamePause: false,    // Game pause state
      musicList: 0,        // Currently playing track index
      musicFade: [10, 10]  // Music fade in/out duration in seconds
    };

    const gameSet = {
      width: 1920,
      height: 1080,
      field: [
        { name: 'Line Width', value: 10 },
        { name: 'Line Color', value: '0xe7f1f0' },
        { name: 'Field Background Color', value: '#016b5d' }
      ]
    };

    class Ball {
      constructor(x, y, style, drag, boundsX) {
        this.sprite = game.add.sprite(x, y, style);
        game.physics.enable(this.sprite, Phaser.Physics.ARCADE);
        this.sprite.body.collideWorldBounds = true;

        if (drag) {
          this.sprite.inputEnabled = true;
          this.sprite.input.enableDrag();
          this.sprite.input.priorityID = 10;

          const bounds = new Phaser.Rectangle(boundsX, 106, 960, 974);
          const graphics = game.add.graphics(bounds.x, bounds.y);
          graphics.beginFill(0x000077);
          graphics.drawRect(0, 0, bounds.width, bounds.height);
          graphics.alpha = 0;
          this.sprite.input.boundsRect = bounds;
        }
      }
    }
  </script>
  <script src="js/global.js?b=2"></script>
  <script src="js/scaleManager.js?b=2"></script>
  <script src="js/states/BootState.js?b=2"></script>
  <script src="js/states/PreloadState.js?b=2"></script>
  <script src="js/states/MenuState.js?b=2"></script>
  <script src="js/states/GameState.js?b=2"></script>
  <script src="js/main.js?b=2"></script>
</body>
</html>
